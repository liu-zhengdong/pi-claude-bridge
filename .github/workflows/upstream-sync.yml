name: upstream-sync

# 检测上游 schuettc/pi-claude-bridge 的新提交，开一个草稿 PR 到本 fork 的默认分支。
#
# 与上游同名文件的区别：上游那份会把分支 rebase 到 elidickinson/main 并推送、再发布
# 到 npm。那套是上游的发布流程，在这个 fork 上运行会重写我们自己的改动，所以整体
# 替换掉。上游的 .github/scripts/upstream-sync.sh 保留但不再被调用。
#
# 这里只做一件事：把上游的提交摆到 PR 里等人看。不自动合入、不发布、不改本地安装。
# 冲突不在 CI 里解决——PR 分支直接指向上游提交，差异和冲突由 PR 界面呈现。

on:
  schedule:
    # 每天 03:00 UTC。上游发布通常在 09:17 UTC 之后，错开以便当天就能看到。
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检测上游并开草稿 PR
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: schuettc/pi-claude-bridge
          UPSTREAM_BRANCH: schuettc-publish
        run: |
          set -euo pipefail

          base="${{ github.event.repository.default_branch }}"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch -q upstream "${UPSTREAM_BRANCH}"

          upstream_sha="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"
          short="$(git rev-parse --short=7 "upstream/${UPSTREAM_BRANCH}")"

          # 已经包含这个提交就没什么可同步的。
          if git merge-base --is-ancestor "${upstream_sha}" "origin/${base}"; then
            echo "已是最新：${base} 已包含上游 ${short}"
            exit 0
          fi

          version="$(git show "upstream/${UPSTREAM_BRANCH}:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')"
          branch="upstream-sync/${version}-${short}"

          # 同一版本同一提交不重复开 PR。分支存在即视为已开过。
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            echo "已存在同步分支 ${branch}，跳过"
            exit 0
          fi

          git push -q origin "${upstream_sha}:refs/heads/${branch}"

          behind="$(git rev-list --count "origin/${base}..${upstream_sha}")"
          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --base "${base}" \
            --head "${branch}" \
            --title "同步上游 ${version}（${short}）" \
            --body "$(cat <<EOF
          上游 [\`${UPSTREAM_REPO}@${UPSTREAM_BRANCH}\`](https://github.com/${UPSTREAM_REPO}/commits/${UPSTREAM_BRANCH}) 有 ${behind} 个我们还没有的提交，版本 \`${version}\`。

          本 PR 由 upstream-sync 工作流自动创建，**不会自动合入**。合入前需要：

          1. 审阅差异，确认 fork 自有改动没有被覆盖；
          2. 处理冲突；
          3. 跑 \`npm run test:unit\` 和 \`npm run typecheck\`；
          4. 合入后如果要更新本地安装，手动执行 \`pi install git:github.com/liu-zhengdong/pi-claude-bridge@<ref>\`。

          fork 自有改动见已合入的 PR 列表。
          EOF
          )"
